const dec=new GLTFLoader();dec.setMeshoptDecoder(MeshoptDecoder);
const Ld=u=>new Promise((r,j)=>dec.load(u,r,undefined,j));
function inPlace(clip,name){clip.tracks=clip.tracks.filter(t=>!(t.name.indexOf('Bip01')===0&&t.name.endsWith('.position')));clip.name=name;return clip}
Promise.all([
 Ld('1-business-male-01.glb'),Ld('4-business-female-01.glb'),Ld('3-business-male-03.glb'),Ld('5-business-female-02.glb'),
 Ld('2-business-male-02.glb'),Ld('6-business-female-03.glb'),
 Ld('7-m_walk_neutral_01.glb'),Ld('8-f_walk_neutral_01.glb'),Ld('9-m_idle_neutral_01.glb'),Ld('10-f_gestic_talk_neutral_01.glb')
]).then(([bm,bf,bm3,bf2,bm2,bf3,mw,fw,mi,ft])=>{
 const Wm=inPlace(mw.animations[0],'Walk'),Wf=inPlace(fw.animations[0],'Walk'),Idl=inPlace(mi.animations[0],'Idle'),Tlk=inPlace(ft.animations[0],'Talk');
 const BM=prepPack(bm,[Wm]),BF=prepPack(bf,[Wf]),BM3=prepPack(bm3,[Wm]),BF2=prepPack(bf2,[Wf]);
 const BM2=prepPack(bm2,[Idl]),BF3=prepPack(bf3,[Tlk]);
 addWalker(BM,'Walk','Matt',0,1.35);addWalker(BF,'Walk','Clara',1,1.25);addWalker(BM3,'Walk','Elias',2,1.45);addWalker(BF2,'Walk','Nina',3,1.3);
 const r1=spawn(BM2,'Idle',2.2,-3.3,Math.PI,'Ravi');r1.userData.interior=true;
 const r2=spawn(BF3,'Talk',8.6,-3.3,Math.PI,'Iris');r2.userData.interior=true;
 window.__setInterior=v=>{[r1,r2].forEach(o=>{o.visible=v;if(o.userData.tag)o.userData.tag.visible=v})};__setInterior(!ceil.visible);
}).catch(e=>{document.getElementById('tag').textContent='ERRO: '+e.message});

// ---------- CÂMERAS ----------
const tag=document.getElementById('tag');
const camP=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,400);
const VIEW=38;
const camO=new THREE.OrthographicCamera(-1,1,1,-1,-200,400);
function sizeO(){const a=innerWidth/innerHeight;camO.left=-VIEW*a/2;camO.right=VIEW*a/2;camO.top=VIEW/2;camO.bottom=-VIEW/2;camO.updateProjectionMatrix()}
function setCtl(c){if(ctl)ctl.dispose();ctl=new OrbitControls(c,ren.domElement);ctl.enableDamping=true}
const EL=.60,DIST=120;
function viewIso(){if(window.__setInterior)__setInterior(!ceil.visible);cam=camO;sizeO();setCtl(camO);camO.zoom=1;camO.updateProjectionMatrix();sc.fog.near=200;sc.fog.far=420;
 const az=Math.PI/4;const d=new THREE.Vector3(Math.sin(az)*Math.cos(EL),Math.sin(EL),Math.cos(az)*Math.cos(EL));
 camO.position.copy(d.multiplyScalar(DIST));ctl.target.set(0,1,5);camO.lookAt(ctl.target);
 ctl.minPolarAngle=EL;ctl.maxPolarAngle=EL;ctl.enablePan=true;ctl.minZoom=.5;ctl.maxZoom=3.4;
 ceil.visible=true;beiral.visible=true;
 tag.textContent='Vista isométrica estilo SimCity — pessoas 3D caminhando pelo campus (arraste p/ mover, role p/ zoom)'}
function viewOut(){if(window.__setInterior)__setInterior(!ceil.visible);cam=camP;setCtl(camP);sc.fog.near=60;sc.fog.far=160;ctl.minPolarAngle=0;ctl.maxPolarAngle=Math.PI*.495;camP.aspect=innerWidth/innerHeight;camP.updateProjectionMatrix();
 camP.position.set(-26,17,38);ctl.target.set(0,2.5,0);ceil.visible=true;beiral.visible=true;
 tag.textContent='Edward Research Labs — campus: HQ central + escritório de cada time'}
function viewIn(){if(window.__setInterior)__setInterior(true);cam=camP;setCtl(camP);sc.fog.near=60;sc.fog.far=160;ctl.minPolarAngle=0;ctl.maxPolarAngle=Math.PI*.495;camP.aspect=innerWidth/innerHeight;camP.updateProjectionMatrix();
 camP.position.set(10.6,2.1,6.4);ctl.target.set(-5.5,1.5,-4);ceil.visible=false;beiral.visible=false;
 tag.textContent='Dentro da HQ: pessoas trabalhando nas estações'}
document.getElementById('bIso').onclick=viewIso;document.getElementById('bOut').onclick=viewOut;document.getElementById('bIn').onclick=viewIn;
const v=Q.get('view');if(v==='in')viewIn();else if(v==='out')viewOut();else viewIso();
if(Q.get('zoom')){camO.zoom=Number(Q.get('zoom'));camO.updateProjectionMatrix()}
if(Q.get('cam')){const p=Q.get('cam').split(',').map(Number);cam.position.set(p[0],p[1],p[2])}
if(Q.get('look')){const p=Q.get('look').split(',').map(Number);ctl.target.set(p[0],p[1],p[2])}
// clique nos prédios
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
addEventListener('pointerdown',e=>{ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,cam);const h=ray.intersectObjects(clickables);if(h.length)tag.textContent='Escritório temático: '+h[0].object.userData.team});
addEventListener('resize',()=>{camP.aspect=innerWidth/innerHeight;camP.updateProjectionMatrix();sizeO();ren.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock();
ren.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);
 mixers.forEach(m=>m.update(dt));
 walkers.forEach(w=>{const c=w.c,tgt=w.wps[w.idx],dx=tgt[0]-c.position.x,dz=tgt[1]-c.position.z,d=Math.hypot(dx,dz);
  if(d<.15){w.idx=(w.idx+1)%4}else{const vx=dx/d*w.spd*dt,vz=dz/d*w.spd*dt;c.position.x+=vx;c.position.z+=vz;
   const want=Math.atan2(dx,dz);let dd=want-c.rotation.y;while(dd>Math.PI)dd-=2*Math.PI;while(dd<-Math.PI)dd+=2*Math.PI;c.rotation.y+=dd*Math.min(1,dt*8);
   if(c.userData.tag)c.userData.tag.position.set(c.position.x,2.15,c.position.z)}});
 ctl.update();ren.render(sc,cam)});
</script></body></html>
